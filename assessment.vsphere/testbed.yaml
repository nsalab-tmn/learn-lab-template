# pyATS testbed for the vSphere lab target.
#
# learn-assessment (pyATS engine) connects to the VM over SSH and runs ms.yaml against it. The
# %ENV{...} values come from tf-dynamic-params.json produced by compute/vsphere/: the worker
# exports each dynamic-param `value` as an environment variable (dashes -> underscores), which
# pyATS interpolates here. Same shape as the Docker testbed — only the SSH port differs (22).
#
# The device is named `lab` — the same name the ms.yaml steps target (`device: lab`).
testbed:
  name: vsphere-lab

devices:
  lab:
    os: linux
    type: linux
    credentials:
      default:
        username: "%ENV{ssh_user}"
        password: "%ENV{ssh_password}"
    connections:
      cli:
        protocol: ssh
        ip: "%ENV{lab_ip}"
        # The Ubuntu VM runs standard sshd on 22 (matches the ssh_port output). Hardcoded rather
        # than %ENV{ssh_port} to avoid string/int coercion; change if you swap the image.
        port: 22
        # ephemeral labs have fresh host keys each deploy — don't prompt / persist them
        ssh_options: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        # help unicon reliably learn the VM's shell prompt (per learn-assessment review)
        arguments:
          connection_timeout: 30
          learn_hostname: true
